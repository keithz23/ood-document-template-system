services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.vm}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.vm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vm}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env.vm}/document-template-system-api:${IMAGE_TAG:-latest}
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/src/DocumentTemplateSystem.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env.vm}
      Jwt__Issuer: ${JWT_ISSUER:-DocumentTemplateSystem}
      Jwt__Audience: ${JWT_AUDIENCE:-DocumentTemplateSystem.Client}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env.vm}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES:-60}
      SeedData__Enabled: "false"
      DevelopmentEmail__FrontendBaseUrl: ${FRONTEND_ORIGIN}
      DevelopmentEmail__ExposePasswordResetUrlInLogs: "false"
      Email__Provider: ${EMAIL_PROVIDER:-Smtp}
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__UseStartTls: ${EMAIL_USE_STARTTLS:-true}
      Email__SmtpUser: ${EMAIL_SMTP_USER:?Set EMAIL_SMTP_USER in .env.vm}
      Email__SmtpAppPassword: ${EMAIL_SMTP_APP_PASSWORD:?Set EMAIL_SMTP_APP_PASSWORD in .env.vm}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS in .env.vm}
      Email__FromName: ${EMAIL_FROM_NAME:-Document Template System}
      Email__FrontendBaseUrl: ${FRONTEND_ORIGIN}
      RateLimiting__PublicAuthentication__PermitLimit: ${AUTH_RATE_LIMIT:-20}
      RateLimiting__PublicAuthentication__WindowSeconds: ${AUTH_RATE_WINDOW_SECONDS:-60}

  frontend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env.vm}/document-template-system-frontend:${IMAGE_TAG:-latest}
    platform: linux/amd64
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env.vm}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/opt/nginx-config:ro
      - ./nginx/select-config.sh:/docker-entrypoint.d/40-select-config.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME in .env.vm}

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

volumes:
  postgres_data:
  letsencrypt:
  certbot_webroot:
